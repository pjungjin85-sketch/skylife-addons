<script>
(function(){
  var SUPABASE_URL = 'https://qvzlwhwxspmofrwdvgdd.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2emx3aHd4c3Btb2Zyd2R2Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzcyNDQsImV4cCI6MjA5OTc1MzI0NH0.uMdamJNn-GHRGfcTNnij6gapaG49bnXjC2fk32RcTfg';
  var createClient = supabase.createClient;
  var sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: window.sessionStorage } });
  var AUTH_EMAIL_DOMAIN = '@skylife-agent.local';
  var USERNAME_RE = /^[a-zA-Z0-9_-]{4,20}$/;

  function unlock(){
    BiIntro.reveal(function(){
      document.getElementById('lock-overlay').classList.add('hidden');
      startLineDraw();
    });
  }
  function showLoginForm(){
    BiIntro.toLogin(function(){
      document.getElementById('lock-loading').style.display = 'none';
      document.getElementById('login-area').classList.add('show');
    });
  }
  function setMsg(type, text){
    var el = document.getElementById('login-msg');
    el.className = 'auth-msg' + (type ? ' ' + type : '');
    el.textContent = text;
  }

  async function checkApprovedAndUnlock(userId, client, isRealSession){
    var res = await client.from('profiles').select('status').eq('id', userId).single();
    var profile = res.data, error = res.error;
    if(error || !profile || profile.status !== 'approved'){
      if(isRealSession) await sb.auth.signOut();
      showLoginForm();
      setMsg('error', profile && profile.status === 'pending' ? '관리자 승인 대기 중입니다' : profile && profile.status === 'rejected' ? '이용이 제한된 계정입니다' : '접근 권한이 없습니다');
      return false;
    }
    unlock();
    return true;
  }

  window.handleLogin = async function(e){
    e.preventDefault();
    var username = document.getElementById('login-username').value.trim();
    var password = document.getElementById('login-password').value;
    if(!USERNAME_RE.test(username)){ setMsg('error','아이디 형식이 올바르지 않습니다'); return false; }
    var btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '로그인 중...';
    var res = await sb.auth.signInWithPassword({ email: username.toLowerCase() + AUTH_EMAIL_DOMAIN, password: password });
    btn.disabled = false; btn.textContent = '로그인';
    if(res.error){ setMsg('error','아이디 또는 비밀번호가 올바르지 않습니다'); return false; }
    await checkApprovedAndUnlock(res.data.session.user.id, sb, true);
    return false;
  };

  async function init(){
    var hash = location.hash;
    if(hash && hash.indexOf('sso=') !== -1){
      var token = decodeURIComponent(hash.split('sso=')[1].split('&')[0]);
      history.replaceState(null, '', location.pathname + location.search);
      var tokenClient = createClient(SUPABASE_URL, SUPABASE_KEY, { global: { headers: { Authorization: 'Bearer ' + token } } });
      var userRes = await tokenClient.auth.getUser(token);
      if(!userRes.error && userRes.data.user){
        await checkApprovedAndUnlock(userRes.data.user.id, tokenClient, false);
        return;
      }
    }
    // SSO 토큰이 없거나 만료된 경우, 기존 로그인 세션이 남아있는지 서버에 매번 재확인한다.
    // (탭 내 캐시 플래그로 이 확인을 건너뛰면 관리자가 계정을 승인 취소해도 즉시 반영되지 않는 문제가 있었음)
    var sessionRes = await sb.auth.getSession();
    if(sessionRes.data.session){
      await checkApprovedAndUnlock(sessionRes.data.session.user.id, sb, true);
    } else {
      showLoginForm();
    }
  }
  window.addEventListener('DOMContentLoaded', init);
})();
</script>

<script>
/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */
let ADDONS = [];
function escHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let activeCat   = '전체';
let activePrice = '전체';

function setCat(btn){
  document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  applyFilters();
}
function setPrice(btn){
  document.querySelectorAll('[data-price]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activePrice = btn.dataset.price;
  applyFilters();
}
function resetFilters(){
  document.getElementById('searchInput').value='';
  document.querySelectorAll('[data-cat]').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-cat="전체"]').classList.add('active');
  document.querySelectorAll('[data-price]').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-price="전체"]').classList.add('active');
  activeCat='전체'; activePrice='전체';
  applyFilters();
}

function applyFilters(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase().replace(/\s+/g,'');
  const filtered = ADDONS.filter(a=>{
    const norm = s => s.toLowerCase().replace(/\s+/g,'');
    const matchCat   = activeCat==='전체' || a.cat===activeCat;
    const matchPrice = activePrice==='전체' || a.priceType===activePrice;
    const matchQ     = !q || norm(a.name).includes(q) || norm(a.desc||'').includes(q) || norm(a.cat).includes(q) || (a.features||[]).some(f=>norm(f).includes(q));
    return matchCat && matchPrice && matchQ;
  });
  renderCards(filtered);
  updateStats(filtered);
}

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
const CATS = ['통화편의','차단/보안','데이터','로밍','OTT/음악','알림','번호','안전/위치','제휴 서비스'];

function renderCards(list){
  const container = document.getElementById('container');
  if(!list.length){
    container.innerHTML=`<div class="empty"><div class="empty-icon"><svg><use href="#i-search"></use></svg></div><div class="empty-text">검색 결과가 없습니다</div></div>`;
    document.getElementById('headerCount').textContent='(0개)';
    return;
  }
  const groups = {};
  CATS.forEach(c=>{groups[c]=[];});
  list.forEach(a=>{
    if(!groups[a.cat]) groups[a.cat]=[];
    groups[a.cat].push(a);
  });

  const allCats = [...CATS, ...Object.keys(groups).filter(c=>!CATS.includes(c))];
  let html='';
  allCats.forEach(cat=>{
    const items = groups[cat];
    if(!items.length) return;
    html += `<div class="section-head"><span class="section-title">${cat}</span><span class="section-count">${items.length}건</span></div>`;
    html += '<div class="grid">';
    items.forEach((a,i)=>{
      const idx = ADDONS.indexOf(a);
      const cls = a.priceType==='무료'?'free':a.priceType==='1회성'?'once':'paid';
      const priceCls = a.priceType==='무료'?'free-price':a.priceType==='1회성'?'once-price':'paid-price';
      const tagType  = a.priceType==='무료'?'tag-free':a.priceType==='1회성'?'tag-once':'tag-paid';
      const hasDetail = (a.features&&a.features.length) || a.conditions || a.trial || a.warn;
      html+=`
      <div class="card ${cls}" onclick="openModal(${idx})">
        <div class="card-head">
          <div class="card-name">${a.name}</div>
          <div class="price-badge ${priceCls}">${a.price}</div>
        </div>
        <div class="card-tags">
          <span class="tag tag-cat">${a.cat}</span>
          <span class="tag ${tagType}">${a.priceType==='무료'?'무료':a.priceType==='1회성'?'1회성':'월정액'}</span>
          ${a.auto?'<span class="tag tag-auto">자동가입</span>':''}
          ${a.trial?'<span class="tag tag-trial">무료체험</span>':''}
        </div>
        <div class="card-desc">${a.desc}</div>
        ${hasDetail?'<div class="detail-hint">상세 정보 보기<svg><use href="#i-detail"></use></svg></div>':''}
      </div>`;
    });
    html += '</div>';
  });
  container.innerHTML = html;
  document.getElementById('headerCount').textContent = `(${list.length}개)`;
}

function updateStats(list){
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statFree').textContent  = list.filter(a=>a.priceType==='무료').length+'건';
  document.getElementById('statPaid').textContent  = list.filter(a=>a.priceType==='유료').length+'건';
  document.getElementById('statOnce').textContent  = list.filter(a=>a.priceType==='1회성').length+'건';
}

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
function openModal(idx){
  const a = ADDONS[idx];
  const priceCls = a.priceType==='무료'?'free-price':a.priceType==='1회성'?'once-price':'paid-price';
  const tagType  = a.priceType==='무료'?'tag-free':a.priceType==='1회성'?'tag-once':'tag-paid';

  document.getElementById('modalTitle').textContent = a.name;

  // tags
  let tags = `<span class="tag tag-cat">${a.cat}</span>`;
  tags += `<span class="tag ${tagType}">${a.priceType==='무료'?'무료':a.priceType==='1회성'?'1회성':'월정액'}</span>`;
  if(a.auto)  tags += '<span class="tag tag-auto">자동가입</span>';
  if(a.trial) tags += '<span class="tag tag-trial">무료체험</span>';
  document.getElementById('modalTags').innerHTML = tags;

  // body
  let body = '';

  if(a.features && a.features.length){
    body += `<div class="modal-section">
      <div class="modal-section-title">주요 기능 및 혜택</div>
      <div class="feature-list">`;
    a.features.forEach(f=>{
      body += `<div class="feature-item"><span class="feature-dot"></span><span>${f}</span></div>`;
    });
    body += `</div></div>`;
  }

  const infoRows = [];
  if(a.howTo)    infoRows.push(['이용 방법', a.howTo]);
  if(a.conditions && a.conditions.length) infoRows.push(['가입 조건', a.conditions.map(escHtml).join('<br>')]);
  if(infoRows.length){
    body += `<div class="modal-section"><div class="modal-section-title">이용 안내</div><div class="info-grid">`;
    infoRows.forEach(([label,val])=>{
      body += `<div class="info-label">${label}</div><div class="info-val">${val}</div>`;
    });
    body += `</div></div>`;
  }

  if(a.trial){
    body += `<div class="modal-section"><div class="trial-box">${a.trial}</div></div>`;
  }
  if(a.warn){
    body += `<div class="modal-section"><div class="warn-box">${a.warn}</div></div>`;
  }
  if(a.note){
    body += `<div class="modal-section"><div class="warn-box" style="background:rgba(99,102,241,.06);border-color:rgba(99,102,241,.2);color:#3730a3;">ℹ️ ${a.note}</div></div>`;
  }

  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModalBtn(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModalBtn(); });

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
// 월별 키("YYYY-MM") 중 이번 달 이하의 가장 최근 월을 고른다 (미래 월은 해당 월이 되면 자동 적용)
function pickActiveMonth(data){
  const now = new Date();
  const currentKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const keys = Object.keys(data).filter(k => /^\d{4}-\d{2}$/.test(k)).sort();
  if (!keys.length) throw new Error('기준월 데이터가 없습니다');
  return keys.filter(k => k <= currentKey).pop() ?? keys[0];
}
function setBaseMonthLabel(key){
  const [y, m] = key.split('-');
  document.getElementById('baseMonthLabel').textContent = `${y}년 ${parseInt(m)}월 기준`;
}
async function loadData() {
  try {
    const res = await fetch('data/addons.json?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const key = pickActiveMonth(data);
    ADDONS = data[key];
    setBaseMonthLabel(key);
    applyFilters();
  } catch (err) {
    document.getElementById('container').innerHTML = `
      <div class="empty">
        <div class="empty-icon"><svg><use href="#i-warn"></use></svg></div>
        <div class="empty-text">데이터를 불러오지 못했습니다</div>
        <div style="font-size:12px;color:var(--light);margin-bottom:16px;">${err.message.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</div>
        <button onclick="loadData()" style="background:var(--red);color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">다시 시도</button>
      </div>`;
  }
}
loadData();
</script>
</body>
</html>
